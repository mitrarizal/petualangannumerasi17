name: Build Android App (AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 kosong atau belum dibuat."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Create and Validate google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - << 'EOF'
          import base64
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              print("ERROR: Secret GOOGLE_SERVICES_JSON kosong atau belum dibuat di GitHub Secrets!")
              sys.exit(1)

          # Bersihkan karakter UTF-8 BOM jika disalin dari editor Windows
          raw = raw.lstrip("\ufeff").strip()

          # Decode otomatis jika secret disimpan dalam format Base64
          if not raw.startswith("{"):
              try:
                  decoded = base64.b64decode(raw).decode("utf-8").lstrip("\ufeff").strip()
                  if decoded.startswith("{"):
                      raw = decoded
              except Exception:
                  pass

          try:
              data = json.loads(raw)
          except json.JSONDecodeError as e:
              print(f"ERROR: Format GOOGLE_SERVICES_JSON bukan JSON valid: {e}")
              sys.exit(1)

          if not isinstance(data, dict) or "project_info" not in data or "client" not in data:
              print("ERROR: Struktur google-services.json tidak lengkap (project_info/client tidak ditemukan).")
              sys.exit(1)

          packages = [
              c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for c in data.get("client", [])
          ]
          if "com.petualangannumerasi.app" not in packages:
              print(f"ERROR: Package 'com.petualangannumerasi.app' tidak ditemukan. Package di file Anda: {packages}")
              sys.exit(1)

          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

          print("OK: app/google-services.json valid untuk com.petualangannumerasi.app")
          EOF

      - name: Build Release AAB (SDK 36)
        env:
          KEYSTORE_FILE_PATH: "keystore.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: petualangan-numerasi-release-aab
          path: app/build/outputs/bundle/release/*.aab
